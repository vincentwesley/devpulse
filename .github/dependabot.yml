version: 2
# Monthly + grouped keeps PR noise low; GitHub security updates are separate and still arrive immediately.
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    # undici is a transitive dep of wrangler/miniflare, pinned via package.json "overrides" (patched 7.30.1). Dependabot's update job for it
    # resolves an older 7.x and fails, so it is ignored here; bump the override by hand (or drop it once miniflare ships a patched range).
    ignore:
      - dependency-name: undici
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
